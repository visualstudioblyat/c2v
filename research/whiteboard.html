<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>c2v whiteboard</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a0a; overflow: hidden; font-family: 'JetBrains Mono', monospace; }
canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');
let W, H;
function resize() { W = c.width = innerWidth * devicePixelRatio; H = c.height = innerHeight * devicePixelRatio; c.style.width = innerWidth + 'px'; c.style.height = innerHeight + 'px'; }
resize(); addEventListener('resize', resize);

const chalk = (a=1) => `rgba(220,220,210,${a})`;
const dim = (a=1) => `rgba(120,120,115,${a})`;
const accent = (a=1) => `rgba(140,170,255,${a})`;
const warm = (a=1) => `rgba(255,200,130,${a})`;
const green = (a=1) => `rgba(130,220,170,${a})`;

let t = 0;
let phase = 0;
const PHASE_DUR = 4.0;
const PHASES = 6;

function grain(x, y) {
    return (Math.sin(x * 12.9898 + y * 78.233) * 43758.5453 % 1) * 0.03;
}

function chalkLine(x0, y0, x1, y1, color, width) {
    ctx.strokeStyle = color;
    ctx.lineWidth = width * devicePixelRatio;
    ctx.lineCap = 'round';
    ctx.beginPath();
    const steps = Math.max(Math.hypot(x1-x0, y1-y0) / 3, 8);
    for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        const jx = (Math.random() - 0.5) * 1.5;
        const jy = (Math.random() - 0.5) * 1.5;
        const x = x0 + (x1-x0)*t + jx;
        const y = y0 + (y1-y0)*t + jy;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
}

function chalkText(text, x, y, size, color, align) {
    ctx.font = `${size * devicePixelRatio}px 'JetBrains Mono'`;
    ctx.fillStyle = color;
    ctx.textAlign = align || 'left';
    ctx.textBaseline = 'middle';
    // slight jitter per char for chalk feel
    const chars = text.split('');
    let cx = x;
    if (align === 'center') cx = x - ctx.measureText(text).width / 2;
    if (align === 'right') cx = x - ctx.measureText(text).width;
    for (const ch of chars) {
        const jx = (Math.random() - 0.5) * 0.8;
        const jy = (Math.random() - 0.5) * 0.8;
        ctx.fillText(ch, cx + jx, y + jy);
        cx += ctx.measureText(ch).width;
    }
}

function chalkBox(x, y, w, h, color) {
    chalkLine(x, y, x+w, y, color, 1.2);
    chalkLine(x+w, y, x+w, y+h, color, 1.2);
    chalkLine(x+w, y+h, x, y+h, color, 1.2);
    chalkLine(x, y+h, x, y, color, 1.2);
}

function chalkArrow(x0, y0, x1, y1, color) {
    chalkLine(x0, y0, x1, y1, color, 1.5);
    const a = Math.atan2(y1-y0, x1-x0);
    const hl = 12 * devicePixelRatio;
    chalkLine(x1, y1, x1 - hl*Math.cos(a-0.4), y1 - hl*Math.sin(a-0.4), color, 1.5);
    chalkLine(x1, y1, x1 - hl*Math.cos(a+0.4), y1 - hl*Math.sin(a+0.4), color, 1.5);
}

function drawBjorklundDots(x, y, pattern) {
    const r = 8 * devicePixelRatio;
    const gap = 28 * devicePixelRatio;
    for (let i = 0; i < pattern.length; i++) {
        ctx.beginPath();
        ctx.arc(x + i * gap, y, r, 0, Math.PI * 2);
        if (pattern[i]) {
            ctx.fillStyle = accent(0.9);
            ctx.fill();
        } else {
            ctx.strokeStyle = dim(0.6);
            ctx.lineWidth = 1.5 * devicePixelRatio;
            ctx.stroke();
        }
    }
}

function drawTree(x, y, balanced) {
    const s = 20 * devicePixelRatio;
    const r = 5 * devicePixelRatio;
    if (!balanced) {
        // Serial chain: a-b-c-d-e-f-g-h cascading left
        const labels = 'abcdefgh';
        for (let i = 0; i < 7; i++) {
            const x0 = x + i * s * 0.7;
            const y0 = y - i * s * 0.8;
            const x1 = x + (i+1) * s * 0.7;
            const y1 = y - (i+1) * s * 0.8;
            chalkLine(x0, y0, x1, y1, dim(0.5), 1);
            ctx.beginPath(); ctx.arc(x0, y0, r, 0, Math.PI*2); ctx.fillStyle = warm(0.7); ctx.fill();
        }
        ctx.beginPath(); ctx.arc(x + 7*s*0.7, y - 7*s*0.8, r, 0, Math.PI*2); ctx.fillStyle = warm(0.7); ctx.fill();
        chalkText('depth 7', x + 8*s*0.7, y - 3*s*0.8, 11, dim(0.7));
    } else {
        // Balanced binary tree
        const nodes = [
            [x, y - 3.5*s],                           // root
            [x - 2*s, y - 2.5*s], [x + 2*s, y - 2.5*s],  // level 1
            [x-3*s, y-1.5*s], [x-1*s, y-1.5*s], [x+1*s, y-1.5*s], [x+3*s, y-1.5*s], // level 2
            [x-3.5*s,y-.5*s],[x-2.5*s,y-.5*s],[x-1.5*s,y-.5*s],[x-.5*s,y-.5*s],
            [x+.5*s,y-.5*s],[x+1.5*s,y-.5*s],[x+2.5*s,y-.5*s],[x+3.5*s,y-.5*s], // leaves
        ];
        const edges = [[0,1],[0,2],[1,3],[1,4],[2,5],[2,6],[3,7],[3,8],[4,9],[4,10],[5,11],[5,12],[6,13],[6,14]];
        for (const [a,b] of edges) {
            chalkLine(nodes[a][0], nodes[a][1], nodes[b][0], nodes[b][1], green(0.4), 1);
        }
        for (const [nx, ny] of nodes) {
            ctx.beginPath(); ctx.arc(nx, ny, r, 0, Math.PI*2); ctx.fillStyle = green(0.8); ctx.fill();
        }
        chalkText('depth 3', x + 4.5*s, y - 2*s, 11, green(0.7));
    }
}

function easeIn(t) { return t < 0 ? 0 : t > 1 ? 1 : t * t * (3 - 2*t); }

function draw() {
    t += 1/60;
    phase = (t / PHASE_DUR) % (PHASES + 1);

    ctx.fillStyle = '#0a0a0a';
    ctx.fillRect(0, 0, W, H);

    // Subtle grid
    ctx.strokeStyle = 'rgba(255,255,255,0.02)';
    ctx.lineWidth = 1;
    const gs = 40 * devicePixelRatio;
    for (let x = 0; x < W; x += gs) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
    for (let y = 0; y < H; y += gs) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

    const mx = W * 0.5;
    const row1 = H * 0.18;
    const row2 = H * 0.48;
    const row3 = H * 0.78;
    const col1 = W * 0.22;
    const col2 = W * 0.78;
    const bw = W * 0.38;
    const bh = H * 0.22;

    // Title
    if (phase >= 0) {
        const a = easeIn(phase * 2);
        chalkText('c2v: 6 theorems → beat Vitis', mx, H * 0.06, 22, chalk(a), 'center');
    }

    // Box 1: Treewidth (top left)
    if (phase >= 0.3) {
        const a = easeIn((phase - 0.3) * 3);
        chalkBox(col1 - bw/2, row1 - bh/2, bw, bh, dim(a * 0.4));
        chalkText('tw(G) ≤ 6', col1, row1 - bh*0.25, 18, chalk(a));
        chalkText('Thorup \'98', col1 + bw*0.3, row1 - bh*0.25, 10, dim(a*0.6));
        chalkText('→ scheduling ∈ P', col1, row1, 14, accent(a));
        chalkText('Vitis: tw=∞ → NP-hard', col1, row1 + bh*0.22, 11, dim(a*0.5));
    }

    // Box 2: Bjorklund (top right)
    if (phase >= 1.0) {
        const a = easeIn((phase - 1.0) * 3);
        chalkBox(col2 - bw/2, row1 - bh/2, bw, bh, dim(a * 0.4));
        chalkText('E(3,8)  II = 8/3 = 2.67', col2, row1 - bh*0.28, 14, chalk(a));
        drawBjorklundDots(col2 - 3.5 * 28 * devicePixelRatio, row1 + bh*0.02, [1,0,0,1,0,0,1,0]);
        chalkText('Vitis: ceil(8/3) = 3', col2, row1 + bh*0.28, 12, warm(a*0.7));
        chalkText('wastes 11% throughput', col2 + bw*0.1, row1 + bh*0.28, 10, dim(a*0.4));
    }

    // Box 3: Tropical (middle left)
    if (phase >= 2.0) {
        const a = easeIn((phase - 2.0) * 3);
        chalkBox(col1 - bw/2, row2 - bh/2, bw, bh, dim(a * 0.4));
        chalkText('λ(A) = max Σw(C)/|C|', col1, row2 - bh*0.22, 15, chalk(a));
        chalkText('= minimum II', col1 + bw*0.25, row2 - bh*0.02, 13, accent(a));
        chalkText('tropical eigenvalue', col1, row2 + bh*0.15, 11, dim(a*0.6));
        chalkText('Howard: O(n²) vs LP: O(n³)', col1, row2 + bh*0.3, 11, green(a*0.6));
    }

    // Box 4: Shannon (middle right)
    if (phase >= 2.8) {
        const a = easeIn((phase - 2.8) * 3);
        chalkBox(col2 - bw/2, row2 - bh/2, bw, bh, dim(a * 0.4));
        chalkText('H = Σ log₂(width_i)', col2, row2 - bh*0.22, 15, chalk(a));
        chalkText('= scheduling freedom', col2 + bw*0.15, row2 - bh*0.02, 12, accent(a));
        chalkText('predicted: 2.10x', col2 - bw*0.15, row2 + bh*0.18, 12, green(a*0.7));
        chalkText('actual: 2.10x  ✓', col2 + bw*0.1, row2 + bh*0.18, 12, green(a));
    }

    // Box 5: Tree balance (bottom center)
    if (phase >= 3.8) {
        const a = easeIn((phase - 3.8) * 3);
        const cx = mx;
        chalkBox(cx - bw*0.7, row3 - bh/2, bw*1.4, bh, dim(a * 0.4));

        drawTree(cx - bw*0.35, row3 + bh*0.3, false);
        chalkText('→', cx, row3, 20, accent(a), 'center');
        drawTree(cx + bw*0.35, row3 + bh*0.3, true);

        chalkText('O(n) → O(log n)', cx, row3 - bh*0.32, 14, chalk(a), 'center');
        chalkText('2.3x on FIR8', cx, row3 - bh*0.15, 11, green(a*0.6), 'center');
    }

    // Arrows between boxes
    if (phase >= 4.5) {
        const a = easeIn((phase - 4.5) * 3);
        // top left → middle left
        chalkArrow(col1, row1 + bh/2, col1, row2 - bh/2, dim(a*0.3));
        // top right → middle right
        chalkArrow(col2, row1 + bh/2, col2, row2 - bh/2, dim(a*0.3));
        // middle → bottom
        chalkArrow(col1, row2 + bh/2, mx - bw*0.3, row3 - bh/2, dim(a*0.3));
        chalkArrow(col2, row2 + bh/2, mx + bw*0.3, row3 - bh/2, dim(a*0.3));
    }

    // Final statement
    if (phase >= 5.5) {
        const a = easeIn((phase - 5.5) * 2);
        chalkText('16k Rust · 157 tests · synthesizes through Yosys', mx, H * 0.94, 12, dim(a*0.5), 'center');
    }

    requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
