[package]
name = "c2v"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Firedancer-style C to Verilog compiler. ML-observable, verified, enterprise-grade."

[[bin]]
name = "c2v"
path = "src/main.rs"

[dependencies]
tree-sitter = "0.24"
tree-sitter-c = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
good_lp = { version = "1.15.2", default-features = false, features = ["highs"] }

[dev-dependencies]
insta = "1"
